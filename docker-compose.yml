# Local development services for Confluent (Story 6.1). Not intended for production — see docker-compose.prod.yml.
# Documents go to the shared dev S3 bucket (see docs/deploiement.md, « Stockage des documents »), not to a local service.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: confluent
      POSTGRES_PASSWORD: confluent
      POSTGRES_DB: confluent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U confluent']
      interval: 5s
      retries: 10


  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
    driver: local
