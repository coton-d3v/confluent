server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ROADMAP E09.06: no page of the site is indexed by search engines — `X-Robots-Tag` on every
    # answer, `<meta name="robots">` in index.html — but a workspace's public page its managers
    # allowed to be indexed. Its address serves public-page.html (index.html without that tag, made by
    # the build) and no header: the page says itself, once the API answered, `index, follow` or
    # `noindex, nofollow`. `add_header` in a location replaces the server's: each location says it.

    # ROADMAP E10.08: text answers compressed — the image's nginx does not by default, and nothing in
    # front of it does: the application's scripts weighed 1.3 MB on the wire instead of 0.35 MB.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Hash-named build assets — long cache, immutable (one header: `expires` added a second one).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # ROADMAP E10.06: the HTML pages are revalidated on every load (`no-cache`), so that a page opened
    # after a deploy names the new version's assets, never former ones the image no longer has.

    # A workspace's public page, `/w/<slug>` only (its forms, `/w/<slug>/…`, are never indexed).
    location ~ ^/w/[^/]+/?$ {
        add_header Cache-Control "no-cache" always;
        try_files /public-page.html =404;
    }

    # SPA: route everything else to index.html so react-router can handle it.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
