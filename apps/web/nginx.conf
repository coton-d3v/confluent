server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ROADMAP E09.06: no page of the site is indexed by search engines — `X-Robots-Tag` on every
    # answer, `<meta name="robots">` in index.html — but a workspace's public page its managers
    # allowed to be indexed. Its address serves public-page.html (index.html without that tag, made by
    # the build) and no header: the page says itself, once the API answered, `index, follow` or
    # `noindex, nofollow`. `add_header` in a location replaces the server's: each location says it.

    # Hash-named build assets — long cache, immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # A workspace's public page, `/w/<slug>` only (its forms, `/w/<slug>/…`, are never indexed).
    location ~ ^/w/[^/]+/?$ {
        try_files /public-page.html =404;
    }

    # SPA: route everything else to index.html so react-router can handle it.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
