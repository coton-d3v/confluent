# Production stack — postgres + api + web. The api-migrate service is a one-shot job
# that applies Prisma migrations before the api container(s) start, ensuring
# zero race conditions on multi-replica deploys.
#
# Required env vars (from .env or CI secrets):
#   API_IMAGE                 — image tag, e.g. ghcr.io/org/confluent-api:production-latest
#   WEB_IMAGE                 — image tag, e.g. ghcr.io/org/confluent-web:production-latest
#   DATABASE_URL              — full Postgres connection string (API runtime account)
#   MIGRATION_DATABASE_URL    — optional; account used by api-migrate (DDL rights)
#   POSTGRES_USER / _PASSWORD / _DB — used by the postgres service only
#   WEB_PORT                  — host port for the web container (default: 80)
#   + all the keys validated by apps/api/src/config/config.schema.ts
#   DOPPLER_TOKEN             — optional; when set, secrets come from Doppler at run time
#                               (never baked into the images — see docs/deploiement.md)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      retries: 10
    restart: unless-stopped

  api-migrate:
    image: ${API_IMAGE}
    command: ['pnpm', '--filter', '@confluent/api', 'db:migrate:deploy']
    environment:
      # Optional: with a Doppler service token the entrypoint injects secrets at run time.
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
      # Migrations use a dedicated account with DDL rights; the running API keeps a least-privilege
      # account (DATABASE_URL). The choice is made by scripts/migrate-deploy.sh, after Doppler
      # injected its secrets, so an injected DATABASE_URL never replaces it (code review R35).
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api-seed-v2:
    image: ${API_IMAGE}
    command: ['pnpm', '--filter', '@confluent/api', 'questionnaire:v2']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    profiles: ['seed']
    restart: 'no'

  api:
    image: ${API_IMAGE}
    command: ['node', 'apps/api/dist/main.js']
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3000}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'

  # Nightly database (and document) backups with local retention and off-server copy.
  # See docs/deploiement.md § Sauvegardes et restauration.
  backup:
    build: ./ops/backup
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      DOCUMENTS_REMOTE: ${DOCUMENTS_REMOTE:-}
      # rclone remotes, e.g. RCLONE_CONFIG_OFFSITE_TYPE=s3 … (see docs/deploiement.md)
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
    volumes:
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-80}:80'

volumes:
  postgres_data:
    driver: local
  backups_data:
    driver: local
