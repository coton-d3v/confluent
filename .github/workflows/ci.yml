# ROADMAP E10.01: the checks every pull request must pass, and every image publication (the
# production-*.yml workflows call this one and publish only if it passed). No secret: dummy values,
# JWT secrets drawn for the run, documents in memory, emails caught by Mailpit, disposable
# PostgreSQL 16 databases (the image used in production).
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run; a publication's run is never cancelled.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Typecheck, lint, web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck (shared, API, web)
        run: pnpm typecheck
      - name: Lint (shared formatting, API, web)
        run: pnpm lint
      # Also fails if index.html lost its `noindex` tag (vite.config.ts, E09.06).
      - name: Web build
        run: pnpm --filter @confluent/web build
      # ROADMAP E10.08: what every visitor downloads before any page, and each chunk, within budget.
      - name: Web bundle budget
        run: pnpm --filter @confluent/web check:bundle

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @confluent/api test --ci

  api-e2e:
    name: API HTTP tests (fake Prisma)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @confluent/api test:e2e --ci

  api-postgres:
    name: PostgreSQL tests and migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: confluent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      # Never the test database: both suites refuse to run on the application's database.
      DATABASE_URL: postgresql://postgres@localhost:5432/not_the_test_database
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/confluent_test
      MIGRATION_CHECK_DATABASE_URL: postgresql://postgres@localhost:5432/migration_chain
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Migrate the test database
        working-directory: apps/api
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm exec prisma migrate deploy
      - name: PostgreSQL tests
        run: pnpm --filter @confluent/api test:pg --ci
      # The whole chain in one `migrate deploy`, over historical data, on an empty database.
      - name: Migration chain
        run: |
          psql postgresql://postgres@localhost:5432/postgres -c 'CREATE DATABASE migration_chain'
          sh apps/api/scripts/check-migration-chain.sh

  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: confluent_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
      # The API sends without STARTTLS to port 25 only (nodemailer.transport.ts).
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['25:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/confluent_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the API and the web app
        run: |
          pnpm --filter @confluent/api build
          VITE_API_URL=http://localhost:3000 pnpm --filter @confluent/web build
      - name: Migrate the database and load the fixtures
        run: |
          pnpm --filter @confluent/api exec prisma migrate deploy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f apps/web/e2e/fixtures.sql
      - name: Start the compiled API
        env:
          NODE_ENV: development
          PORT: '3000'
          FRONTEND_URL: http://localhost:8080
          API_PUBLIC_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_PORT: '25'
          SMTP_FROM: noreply@confluent.test
          STORAGE_DRIVER: memory
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: unused
          S3_ACCESS_KEY: unused
          S3_SECRET_KEY: unused
          SWAGGER_ENABLED: 'false'
        run: |
          JWT_SECRET=$(openssl rand -hex 32) JWT_REFRESH_SECRET=$(openssl rand -hex 32) \
            nohup node apps/api/dist/main.js > api.log 2>&1 &
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors http://localhost:3000/ > /dev/null
      # As the production image serves it: the repository's nginx.conf (X-Robots-Tag, public pages).
      - name: Serve the web app with nginx
        run: |
          docker run -d --name web -p 8080:80 \
            -v "$PWD/apps/web/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/ > /dev/null
      - name: Install Chromium
        run: pnpm --filter @confluent/web exec playwright install --with-deps --only-shell chromium
      - name: Smoke tests
        env:
          SMOKE_NGINX: '1'
        run: pnpm --filter @confluent/web test:smoke
      - name: Collect the logs
        if: failure()
        run: docker logs web > web.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-results
          path: |
            api.log
            web.log
            apps/web/e2e/results
          retention-days: 7
